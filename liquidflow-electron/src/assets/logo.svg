<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lfAir" x1="128" y1="16" x2="128" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F7F3"/><stop offset="1" stop-color="#C1EBE3"/>
    </linearGradient>
    <linearGradient id="lfWater" x1="128" y1="110" x2="128" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3FBEB0"/><stop offset="1" stop-color="#0A4A46"/>
    </linearGradient>
    <clipPath id="lfSquircle"><rect x="16" y="16" width="224" height="224" rx="66"/></clipPath>
  </defs>
  <g clip-path="url(#lfSquircle)">
    <rect x="16" y="16" width="224" height="110" fill="url(#lfAir)"/>
    <!-- underwater with wavy surface -->
    <path d="M16 114 C 66 104, 128 124, 240 110 L 240 240 L 16 240 Z" fill="url(#lfWater)"/>
    <!-- light shafts -->
    <g fill="#FFFFFF" opacity="0.08">
      <path d="M88 112 L 74 240 L 104 240 Z"/>
      <path d="M150 110 L 138 240 L 170 240 Z"/>
      <path d="M196 111 L 188 240 L 214 240 Z"/>
    </g>
    <!-- current waves -->
    <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-width="3" opacity="0.22">
      <path d="M44 158 C 90 150, 150 166, 212 156"/>
      <path d="M50 194 C 96 186, 156 202, 206 192"/>
    </g>
    <!-- rising bubbles -->
    <g fill="#FFFFFF">
      <circle cx="96" cy="200" r="7" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="106" cy="172" r="5" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="112" cy="150" r="3.4" fill-opacity="0.18"/>
      <circle cx="166" cy="208" r="6" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.8"/>
      <circle cx="176" cy="182" r="4.2" fill-opacity="0.2"/>
      <circle cx="182" cy="160" r="3" fill-opacity="0.18"/>
    </g>
    <!-- bright surface meniscus -->
    <path d="M16 114 C 66 104, 128 124, 240 110" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
